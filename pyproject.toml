[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ifp-contract-slicer"
version = "0.6.0"
description = "IFP API contracts and contextual field/rule evidence tracing"
requires-python = ">=3.11"

[project.scripts]
ifp-contract = "ifp_contract.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
